name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Check Python backend compiles
        run: python3 -m compileall -q main.py py_modules

      - name: Build installable zip
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveWaypoint
          path: release/SaveWaypoint.zip

      # A tag push publishes the zip so Decky can install it straight from the
      # release URL.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/SaveWaypoint.zip
          generate_release_notes: true
