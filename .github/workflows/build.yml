name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # annotated tag messages become the release titles

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Check Python backend compiles
        run: python3 -m compileall -q main.py py_modules

      - name: Build installable zip
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveWaypoint
          path: release/SaveWaypoint.zip

      # A tag push publishes the zip so Decky can install it straight from the
      # release URL.
      # Release title = the annotated tag's subject, e.g.
      #   git tag -a v0.3.0 -m "v0.3.0 — Auto-backup on game close"
      - name: Read tag subject
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag
        run: |
          # checkout leaves a lightweight ref, so %(contents:subject) would fall
          # through to the commit message. Re-fetch the tag object itself.
          git fetch --force --tags --depth=1 origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          subject=$(git for-each-ref --format='%(contents:subject)' \
            "refs/tags/${GITHUB_REF_NAME}")
          case "$subject" in
            v*) ;;                       # a real annotated tag message
            *) subject="$GITHUB_REF_NAME" ;;   # lightweight tag: use the tag name
          esac
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      # The tag decides the channel: v1.2.3 is stable, v1.2.3-beta.N ships as a
      # pre-release so only users on the beta channel are offered it.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/SaveWaypoint.zip
          name: ${{ steps.tag.outputs.subject }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
